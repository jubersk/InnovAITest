name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use Node.js version 20

      - name: Install Newman and Reporters
        run: |
          npm install -g newman@5.3.2  # Install specific version of Newman
          npm install -g newman-reporter-htmlextra@1.23.0  # Install specific version of htmlextra reporter

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Use Python version 3.9

      - name: Install Python Dependencies
        run: |
          python -m venv venv  # Create a virtual environment
          source venv/bin/activate  # Activate the virtual environment
          pip install -r requirements.txt  # Install Python dependencies from requirements.txt

      - name: Start Server
        run: |
          source venv/bin/activate  # Activate the virtual environment
          nohup fastapi dev application.py > server.log 2>&1 &  # Start the FastAPI server in the background

      - name: Wait for Server to Start and Check Availability
        run: |
          sleep 20  # Wait 20 seconds to ensure the server has started
          curl --retry 5 --retry-connrefused --retry-delay 5 http://localhost:8000  # Check if the server is responding

      - name: Download Postman Collection
        run: |
          curl -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" -o FastAPI.postman_collection.json https://raw.githubusercontent.com/jubersk/InnovAITest/main/FastAPI.postman_collection.json

      - name: Download Postman Environment
        run: |
          curl -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" -o innovationTests.postman_environment.json https://raw.githubusercontent.com/jubersk/InnovAITest/main/innovationTests.postman_environment.json

      - name: Check Downloaded Files
        run: |
          ls -l  # List files in the current directory
          head -n 20 FastAPI.postman_collection.json  # Show the first 20 lines of the Postman collection file
          head -n 20 innovationTests.postman_environment.json  # Show the first 20 lines of the Postman environment file

      - name: Validate Postman Collection
        run: jq . FastAPI.postman_collection.json  # Validate JSON syntax of the Postman collection

      - name: Validate Postman Environment
        run: jq . innovationTests.postman_environment.json  # Validate JSON syntax of the Postman environment

      - name: Run API Tests
        run: |
          set -x  # Enable debugging output
          newman run FastAPI.postman_collection.json -e innovationTests.postman_environment.json -r htmlextra --reporter-htmlextra-export ./report.html --verbose || true

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: newman-report
          path: ./report.html  # Upload the generated Newman report
