name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Optional: Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use Node.js 20

      - name: Install Dependencies
        run: |
          npm install -g newman@5.3.2  # Specify the Newman version
          npm install -g newman-reporter-htmlextra@1.23.0  # Specify the reporter version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Specify the Python version

      - name: Install Python Dependencies
        run: |
          python -m venv venv  # Create a virtual environment
          source venv/bin/activate  # Activate the virtual environment
          pip install -r requirements.txt  # Install dependencies

      - name: Start Server
        run: |
          source venv/bin/activate  # Activate virtual environment
          echo "Starting FastAPI server on port 8080..."  # Add a console log
          nohup uvicorn application:app --host 0.0.0.0 --port 8080 > server.log 2>&1 &  # Start the server in the background using Uvicorn
          echo "Server started, waiting for it to be ready..."  # Another console log

      - name: Wait for Server to Start
        run: sleep 20  # Wait for 20 seconds to ensure the server has started

      - name: Check Server Log
        run: cat server.log  # Output server log to console

      - name: Verify Server is Running on Correct Port
        run: |
          netstat -tuln | grep 8080  # Check if port 8080 is in use
          # or alternatively
          lsof -i :8080

      - name: Download Postman Collection
        run: |
          curl -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" -o FastAPI.postman_collection.json https://raw.githubusercontent.com/jubersk/InnovAITest/main/FastAPI.postman_collection.json

      - name: Download Postman Environment
        run: |
          curl -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" -o innovationTests.postman_environment.json https://raw.githubusercontent.com/jubersk/InnovAITest/main/innovationTests.postman_environment.json

      - name: Check Downloaded Files
        run: |
          ls -l  # List files in the directory
          head -n 20 FastAPI.postman_collection.json
          head -n 20 innovationTests.postman_environment.json	      

      - name: Validate Postman Collection
        run: |
          jq . FastAPI.postman_collection.json

      - name: Validate Postman Environment
        run: |
          jq . innovationTests.postman_environment.json
          
      - name: Test API Endpoint Accessibility
        run: |
          curl -v http://localhost:8080/models
                    
      - name: Run API Tests
        run: |
          set -x  # Enable debugging output
          ls -l  # List files in the directory to confirm paths
          cat FastAPI.postman_collection.json  # Print the Postman collection file to ensure it's correctly formatted
          cat innovationTests.postman_environment.json  # Print the Postman environment file to ensure it's correctly formatted
          newman run ./FastAPI.postman_collection.json -e ./innovationTests.postman_environment.json -r htmlextra --reporter-htmlextra-export ./report.html --verbose --reporter-cli-no-failures --reporter-cli-no-summary --disable-unicode | tee newman-output.txt

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: newman-report
          path: ./report.html
