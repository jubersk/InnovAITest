name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Optional: Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use Node.js 20

      - name: Install Dependencies
        run: |
          npm install -g newman@5.3.2  # Specify the Newman version
          npm install -g newman-reporter-htmlextra@1.23.0  # Specify the reporter version

      - name: Download Postman Collection
        run: |
          curl -L -o FastAPI.postman_collection.json https://raw.githubusercontent.com/jubersk/Innov
